<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マイクラ風・再現デモ</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: #9cd7ff;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      line-height: 1.5;
      font-size: 14px;
      backdrop-filter: blur(4px);
      z-index: 10;
      pointer-events: none;
    }
    #crosshair {
      position: fixed;
      inset: 0;
      margin: auto;
      width: 18px;
      height: 18px;
      z-index: 8;
      pointer-events: none;
    }
    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }
    #crosshair::before { width: 18px; height: 2px; top: 8px; }
    #crosshair::after { width: 2px; height: 18px; left: 8px; }
    #hint {
      position: fixed;
      right: 12px;
      bottom: 12px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hud">🧱 マイクラ風デモ<br />WASD: 移動 / マウス: 視点 / Space: ジャンプ</div>
  <div id="crosshair"></div>
  <div id="hint">画面クリックで操作開始</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
  <script>
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9cd7ff);
    scene.fog = new THREE.Fog(0x9cd7ff, 40, 200);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 7, 20);

    const hemi = new THREE.HemisphereLight(0xffffee, 0x6d4c41, 0.9);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(30, 45, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -100;
    sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    scene.add(sun);

    const BLOCK = 2;
    const boxGeo = new THREE.BoxGeometry(BLOCK, BLOCK, BLOCK);

    function cube(color, x, y, z) {
      const mesh = new THREE.Mesh(
        boxGeo,
        new THREE.MeshLambertMaterial({ color })
      );
      mesh.position.set(x * BLOCK, y * BLOCK, z * BLOCK);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    // 地形（起伏のある草ブロック）
    const worldSize = 22;
    const blocks = [];
    for (let x = -worldSize; x <= worldSize; x++) {
      for (let z = -worldSize; z <= worldSize; z++) {
        const h = Math.floor((Math.sin(x * 0.35) + Math.cos(z * 0.33)) * 1.2);
        cube(0x3aa655, x, h, z);
        if (h <= -1) {
          cube(0x5fa8ff, x, h - 1, z); // 水面
        } else {
          cube(0x8d6e63, x, h - 1, z); // 土
        }
      }
    }

    // 木を配置
    function makeTree(x, z, height = 3) {
      const base = Math.floor((Math.sin(x * 0.35) + Math.cos(z * 0.33)) * 1.2);
      for (let y = 1; y <= height; y++) cube(0x6d4c41, x, base + y, z);
      for (let ox = -1; ox <= 1; ox++) {
        for (let oz = -1; oz <= 1; oz++) {
          for (let oy = height; oy <= height + 1; oy++) {
            if (Math.abs(ox) + Math.abs(oz) < 3) cube(0x2e7d32, x + ox, base + oy, z + oz);
          }
        }
      }
      cube(0x2e7d32, x, base + height + 2, z);
    }

    [[-7, -6], [8, -9], [5, 7], [-10, 10], [0, -13], [13, 4]].forEach(([x, z]) => makeTree(x, z));

    // 簡易ハウス
    const hx = 2, hz = 2;
    for (let x = -2; x <= 2; x++) {
      for (let z = -2; z <= 2; z++) {
        for (let y = 1; y <= 3; y++) {
          const isWall = Math.abs(x) === 2 || Math.abs(z) === 2;
          if (isWall) cube(0xc8a165, hx + x, y, hz + z);
        }
      }
    }
    for (let x = -3; x <= 3; x++) {
      for (let z = -3; z <= 3; z++) cube(0x8d6e63, hx + x, 4, hz + z);
    }

    // 操作
    const keys = {};
    let yaw = 0;
    let pitch = -0.2;
    let yVelocity = 0;
    let onGround = false;

    const hint = document.getElementById("hint");
    renderer.domElement.addEventListener("click", () => {
      renderer.domElement.requestPointerLock();
    });

    document.addEventListener("pointerlockchange", () => {
      hint.textContent = document.pointerLockElement === renderer.domElement
        ? "操作中（Escで解除）"
        : "画面クリックで操作開始";
    });

    document.addEventListener("mousemove", (event) => {
      if (document.pointerLockElement !== renderer.domElement) return;
      yaw -= event.movementX * 0.002;
      pitch -= event.movementY * 0.002;
      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
    });

    addEventListener("keydown", (e) => keys[e.code] = true);
    addEventListener("keyup", (e) => keys[e.code] = false);

    const clock = new THREE.Clock();

    function groundHeightAt(x, z) {
      const gx = Math.round(x / BLOCK);
      const gz = Math.round(z / BLOCK);
      return Math.floor((Math.sin(gx * 0.35) + Math.cos(gz * 0.33)) * 1.2) * BLOCK + BLOCK * 1.75;
    }

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.033);

      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      const forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation).setY(0).normalize();
      const right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation).setY(0).normalize();
      const speed = 9 * dt;

      if (keys.KeyW) camera.position.addScaledVector(forward, speed);
      if (keys.KeyS) camera.position.addScaledVector(forward, -speed);
      if (keys.KeyA) camera.position.addScaledVector(right, -speed);
      if (keys.KeyD) camera.position.addScaledVector(right, speed);

      const floor = groundHeightAt(camera.position.x, camera.position.z);
      if (camera.position.y <= floor) {
        camera.position.y = floor;
        yVelocity = 0;
        onGround = true;
      } else {
        onGround = false;
      }

      if (keys.Space && onGround) {
        yVelocity = 0.24;
        onGround = false;
      }

      yVelocity -= 0.012;
      camera.position.y += yVelocity;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
